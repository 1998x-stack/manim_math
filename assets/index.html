<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上海初高中数学直通车 - Video Gallery</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=JetBrains+Mono:wght@400;600&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-deep: #06060b;
  --bg-base: #0c0c14;
  --bg-card: #14141f;
  --bg-card-hover: #1a1a2a;
  --bg-sidebar: #0a0a12;
  --border: #1e1e30;
  --border-active: #c9a84c44;
  --gold: #c9a84c;
  --gold-dim: #a0833a;
  --gold-glow: #c9a84c33;
  --text-primary: #e8e4dc;
  --text-secondary: #9a9688;
  --text-muted: #5e5c54;
  --green: #4a9e6e;
  --red: #c0544e;
  --blue: #5b8dd9;
  --font-serif: 'Noto Serif SC', 'PingFang SC', 'Songti SC', serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
  --sidebar-w: 320px;
  --topbar-h: 64px;
}

html { font-size: 15px; }
body {
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: var(--font-serif);
  min-height: 100vh;
  overflow: hidden;
}

/* Grain overlay */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  opacity: 0.03;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* ─── Top Bar ─── */
.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: var(--topbar-h);
  background: var(--bg-base);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  z-index: 100;
  gap: 20px;
}

.brand {
  font-size: 1.1rem;
  font-weight: 900;
  color: var(--gold);
  letter-spacing: 0.02em;
  white-space: nowrap;
  flex-shrink: 0;
}
.brand span { color: var(--text-muted); font-weight: 400; font-size: 0.75rem; margin-left: 8px; }

.level-tabs {
  display: flex;
  gap: 2px;
  background: var(--bg-deep);
  border-radius: 8px;
  padding: 3px;
  flex-shrink: 0;
}
.level-tab {
  padding: 6px 16px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font-family: var(--font-serif);
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}
.level-tab:hover { color: var(--text-primary); background: var(--bg-card); }
.level-tab.active { color: var(--gold); background: var(--bg-card); box-shadow: 0 0 12px var(--gold-glow); }

.search-box {
  flex: 1;
  max-width: 360px;
  position: relative;
}
.search-box input {
  width: 100%;
  padding: 8px 14px 8px 36px;
  background: var(--bg-deep);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-primary);
  font-family: var(--font-serif);
  font-size: 0.85rem;
  outline: none;
  transition: border-color 0.2s;
}
.search-box input::placeholder { color: var(--text-muted); }
.search-box input:focus { border-color: var(--gold-dim); }
.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 0.85rem;
}

.stats-bar {
  display: flex;
  gap: 16px;
  margin-left: auto;
  flex-shrink: 0;
}
.stat {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--text-muted);
}
.stat b { color: var(--gold); font-weight: 600; }

/* ─── Layout ─── */
.layout {
  display: flex;
  position: fixed;
  top: var(--topbar-h);
  left: 0;
  right: 0;
  bottom: 0;
}

/* ─── Sidebar ─── */
.sidebar {
  width: var(--sidebar-w);
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 12px 0;
  flex-shrink: 0;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.tree-grade {
  margin-bottom: 2px;
}
.tree-grade-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 0.9rem;
  font-weight: 700;
  transition: all 0.15s;
  user-select: none;
}
.tree-grade-header:hover { color: var(--text-primary); background: var(--bg-card); }
.tree-grade-header .arrow {
  font-size: 0.6rem;
  transition: transform 0.2s;
  color: var(--text-muted);
  flex-shrink: 0;
}
.tree-grade.open > .tree-grade-header .arrow { transform: rotate(90deg); }
.tree-grade.open > .tree-grade-header { color: var(--gold-dim); }

.tree-semester {
  margin-left: 12px;
  border-left: 1px solid var(--border);
}
.tree-semester-label {
  padding: 4px 12px;
  font-size: 0.75rem;
  color: var(--text-muted);
  font-weight: 400;
  letter-spacing: 0.05em;
}

.tree-chapter {
  padding: 6px 12px 6px 24px;
  font-size: 0.8rem;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.15s;
  line-height: 1.4;
  border-left: 2px solid transparent;
  margin-left: -1px;
}
.tree-chapter:hover { color: var(--text-primary); background: var(--bg-card); }
.tree-chapter.active {
  color: var(--gold);
  border-left-color: var(--gold);
  background: var(--gold-glow);
}
.tree-chapter .ch-count {
  float: right;
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--text-muted);
  margin-top: 2px;
}

.tree-children { display: none; }
.tree-grade.open > .tree-children { display: block; }

/* ─── Main Content ─── */
.main {
  flex: 1;
  overflow-y: auto;
  padding: 28px 32px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

/* Breadcrumb */
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-bottom: 20px;
  font-family: var(--font-mono);
}
.breadcrumb span { cursor: pointer; transition: color 0.15s; }
.breadcrumb span:hover { color: var(--text-primary); }
.breadcrumb .sep { color: var(--border); cursor: default; }
.breadcrumb .current { color: var(--gold-dim); }

/* Chapter heading */
.chapter-heading {
  margin-bottom: 28px;
}
.chapter-heading h2 {
  font-size: 1.5rem;
  font-weight: 900;
  color: var(--text-primary);
  margin-bottom: 6px;
}
.chapter-heading .ch-meta {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--text-muted);
}
.chapter-heading .ch-meta b { color: var(--green); }

/* Topic grid */
.topic-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
}

/* Topic card */
.topic-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  transition: all 0.25s ease;
  cursor: pointer;
}
.topic-card:hover {
  border-color: var(--border-active);
  background: var(--bg-card-hover);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3), 0 0 0 1px var(--border-active);
}

.card-video-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 9/16;
  max-height: 360px;
  overflow: hidden;
  background: var(--bg-deep);
}
.card-video-wrap video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.card-video-wrap.playing video { object-fit: contain; }

.card-placeholder {
  position: relative;
  width: 100%;
  aspect-ratio: 9/16;
  max-height: 360px;
  overflow: hidden;
  background: linear-gradient(135deg, #0e0e1a 0%, #16162a 50%, #0e0e1a 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
}
.card-placeholder::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 40%, var(--gold-glow), transparent 60%);
}
.placeholder-icon {
  font-size: 2.5rem;
  opacity: 0.2;
  color: var(--gold);
  position: relative;
}
.placeholder-label {
  font-size: 0.75rem;
  color: var(--text-muted);
  position: relative;
  font-family: var(--font-mono);
}

.play-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.3);
  opacity: 1;
  transition: opacity 0.2s;
}
.card-video-wrap.playing .play-overlay { opacity: 0; pointer-events: none; }
.play-btn {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--gold);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 20px rgba(201,168,76,0.4);
  transition: transform 0.2s;
}
.topic-card:hover .play-btn { transform: scale(1.1); }
.play-btn svg { width: 20px; height: 20px; fill: var(--bg-deep); margin-left: 3px; }

.card-info {
  padding: 14px 16px;
}
.card-number {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--gold-dim);
  font-weight: 600;
  margin-bottom: 4px;
}
.card-title {
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 6px;
  line-height: 1.3;
}
.card-desc {
  font-size: 0.75rem;
  color: var(--text-secondary);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-badge {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 0.6rem;
  padding: 2px 6px;
  border-radius: 4px;
  margin-top: 8px;
}
.badge-video { background: #1a2e1a; color: var(--green); }
.badge-no-video { background: #2e1a1a; color: var(--red); }

/* ─── Overview / Home ─── */
.overview {
  max-width: 900px;
}
.overview h1 {
  font-size: 2.2rem;
  font-weight: 900;
  color: var(--text-primary);
  margin-bottom: 8px;
  line-height: 1.2;
}
.overview .subtitle {
  font-size: 0.9rem;
  color: var(--text-muted);
  margin-bottom: 36px;
  font-style: italic;
}

.overview-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 36px;
}

.overview-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 24px;
  cursor: pointer;
  transition: all 0.25s;
}
.overview-card:hover {
  border-color: var(--border-active);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}
.ov-label {
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.ov-number {
  font-family: var(--font-mono);
  font-size: 2rem;
  font-weight: 600;
  color: var(--gold);
  margin-bottom: 4px;
}
.ov-detail {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--text-secondary);
}

.progress-bar-wrap {
  width: 100%;
  height: 4px;
  background: var(--bg-deep);
  border-radius: 2px;
  margin-top: 12px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: var(--gold);
  border-radius: 2px;
  transition: width 0.6s ease;
}

/* ─── Search results ─── */
.search-results h3 {
  font-size: 1.1rem;
  color: var(--text-secondary);
  margin-bottom: 16px;
}
.search-results h3 b { color: var(--gold); }
.search-result-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.15s;
}
.search-result-item:hover { border-color: var(--border-active); background: var(--bg-card-hover); }
.sr-path {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--text-muted);
}
.sr-name {
  font-size: 0.85rem;
  color: var(--text-primary);
  font-weight: 700;
}
.sr-badge {
  margin-left: auto;
  flex-shrink: 0;
}

/* ─── Responsive ─── */
@media (max-width: 900px) {
  :root { --sidebar-w: 260px; }
  .brand span { display: none; }
  .stats-bar { display: none; }
}
@media (max-width: 700px) {
  .sidebar { display: none; }
  .topbar { padding: 0 12px; }
  .main { padding: 16px; }
  .topic-grid { grid-template-columns: 1fr; }
}

/* ─── Scrollbar ─── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ─── Expand animation ─── */
.topic-card.expanded .card-video-wrap { max-height: none; }
.topic-card.expanded .card-video-wrap video { object-fit: contain; }
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="brand">上海初高中数学直通车<span>@emptyandcalm</span></div>
  <div class="level-tabs" id="levelTabs"></div>
  <div class="search-box">
    <span class="search-icon">&#x1F50D;</span>
    <input type="text" id="searchInput" placeholder="Search topics..." autocomplete="off">
  </div>
  <div class="stats-bar" id="statsBar"></div>
</div>

<!-- Layout -->
<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
</div>

<script>
let CATALOG = null;
let currentLevel = null;
let currentChapterPath = null; // "levelIdx/gradeIdx/semIdx/chIdx"

const REPO_OWNER = '1998x-stack';
const REPO_NAME = 'manim_math';
const REPO_BRANCH = 'main';

function videoUrl(relPath) {
  if (!relPath) return '';
  const isGitHubPages = location.hostname.endsWith('.github.io');
  if (isGitHubPages) {
    const encoded = relPath.split('/').map(encodeURIComponent).join('/');
    return `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${REPO_BRANCH}/${encoded}`;
  }
  return '../' + relPath;
}

async function loadCatalog() {
  const resp = await fetch('catalog.json');
  CATALOG = await resp.json();
  init();
}

function init() {
  renderLevelTabs();
  renderStatsBar();
  selectLevel(0);
}

// ─── Level Tabs ───
function renderLevelTabs() {
  const el = document.getElementById('levelTabs');
  el.innerHTML = CATALOG.levels.map((lv, i) =>
    `<button class="level-tab" data-idx="${i}" onclick="selectLevel(${i})">${lv.name}</button>`
  ).join('');
}

function selectLevel(idx) {
  currentLevel = idx;
  currentChapterPath = null;
  document.querySelectorAll('.level-tab').forEach((t, i) =>
    t.classList.toggle('active', i === idx)
  );
  renderSidebar();
  renderOverview();
}

// ─── Stats ───
function renderStatsBar() {
  const s = CATALOG.stats;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat"><b>${s.totalTopics}</b> topics</div>
    <div class="stat"><b>${s.totalWithVideo}</b> videos</div>
    <div class="stat"><b>${Math.round(s.totalWithVideo / s.totalTopics * 100)}%</b> complete</div>
  `;
}

// ─── Sidebar ───
function renderSidebar() {
  const lv = CATALOG.levels[currentLevel];
  const el = document.getElementById('sidebar');
  let html = '';

  lv.grades.forEach((grade, gi) => {
    html += `<div class="tree-grade" id="grade-${gi}">`;
    html += `<div class="tree-grade-header" onclick="toggleGrade(${gi})">
      <span class="arrow">&#9654;</span>${grade.name}
    </div>`;
    html += `<div class="tree-children">`;

    grade.semesters.forEach((sem, si) => {
      if (sem.name) {
        html += `<div class="tree-semester">`;
        html += `<div class="tree-semester-label">${sem.name}</div>`;
      }
      sem.chapters.forEach((ch, ci) => {
        const path = `${currentLevel}/${gi}/${si}/${ci}`;
        const active = currentChapterPath === path ? ' active' : '';
        html += `<div class="tree-chapter${active}" data-path="${path}"
          onclick="selectChapter('${path}')">
          ${ch.chapterShort}
          <span class="ch-count">${ch.topics.length}</span>
        </div>`;
      });
      if (sem.name) html += `</div>`;
    });

    html += `</div></div>`;
  });

  el.innerHTML = html;
}

function toggleGrade(gi) {
  const el = document.getElementById(`grade-${gi}`);
  el.classList.toggle('open');
}

// ─── Chapter View ───
function selectChapter(path) {
  currentChapterPath = path;
  const [li, gi, si, ci] = path.split('/').map(Number);
  const lv = CATALOG.levels[li];
  const grade = lv.grades[gi];
  const sem = grade.semesters[si];
  const ch = sem.chapters[ci];

  // Update sidebar active state
  document.querySelectorAll('.tree-chapter').forEach(el =>
    el.classList.toggle('active', el.dataset.path === path)
  );

  // Open parent grade
  const gradeEl = document.getElementById(`grade-${gi}`);
  if (gradeEl) gradeEl.classList.add('open');

  renderChapter(lv, grade, sem, ch);
}

function renderChapter(lv, grade, sem, ch) {
  const main = document.getElementById('main');
  const vidCount = ch.topics.filter(t => t.hasVideo).length;

  let html = `
    <div class="breadcrumb">
      <span onclick="selectLevel(${currentLevel})">${lv.name}</span>
      <span class="sep">/</span>
      <span>${grade.name}</span>
      ${sem.name ? `<span class="sep">/</span><span>${sem.name}</span>` : ''}
      <span class="sep">/</span>
      <span class="current">${ch.chapterShort}</span>
    </div>
    <div class="chapter-heading">
      <h2>${ch.name}</h2>
      <div class="ch-meta"><b>${vidCount}</b> / ${ch.topics.length} videos available</div>
    </div>
    <div class="topic-grid">
  `;

  ch.topics.forEach(topic => {
    const descLines = topic.docstring.split('\n').filter(l => l.trim());
    const title = descLines[0] || topic.name;
    const desc = descLines.slice(1).filter(l =>
      !l.startsWith('manim') && !l.startsWith('作者') && !l.startsWith('格式') && !l.startsWith('目标')
    ).join(' ').substring(0, 200);

    html += `<div class="topic-card" data-id="${topic.id}">`;

    if (topic.hasVideo) {
      html += `
        <div class="card-video-wrap" onclick="toggleVideo(this)">
          <video preload="metadata" src="${videoUrl(topic.videoFile)}" muted></video>
          <div class="play-overlay">
            <div class="play-btn">
              <svg viewBox="0 0 24 24"><polygon points="8,5 19,12 8,19"/></svg>
            </div>
          </div>
        </div>`;
    } else {
      html += `
        <div class="card-placeholder">
          <div class="placeholder-icon">&#x1F3AC;</div>
          <div class="placeholder-label">No video yet</div>
        </div>`;
    }

    html += `
      <div class="card-info">
        ${topic.number ? `<div class="card-number">#${topic.number}</div>` : ''}
        <div class="card-title">${topic.name}</div>
        ${desc ? `<div class="card-desc">${escHtml(desc)}</div>` : ''}
        <span class="card-badge ${topic.hasVideo ? 'badge-video' : 'badge-no-video'}">
          ${topic.hasVideo ? 'VIDEO' : 'PENDING'}
        </span>
      </div>
    </div>`;
  });

  html += `</div>`;
  main.innerHTML = html;
  main.scrollTop = 0;
}

function toggleVideo(wrap) {
  const video = wrap.querySelector('video');
  if (video.paused) {
    document.querySelectorAll('.card-video-wrap video').forEach(v => {
      if (v !== video) { v.pause(); v.parentElement.classList.remove('playing'); }
    });
    video.muted = false;
    video.play();
    wrap.classList.add('playing');
  } else {
    video.pause();
    wrap.classList.remove('playing');
  }
}

// ─── Overview ───
function renderOverview() {
  const lv = CATALOG.levels[currentLevel];
  const stats = CATALOG.stats.perLevel[lv.id];
  const pct = Math.round(stats.withVideo / stats.total * 100);

  let totalChapters = 0;
  lv.grades.forEach(g => g.semesters.forEach(s => totalChapters += s.chapters.length));

  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="overview">
      <h1>${lv.name}</h1>
      <div class="subtitle">上海初高中数学直通车 - 沪教版五四制教学动画</div>

      <div class="overview-grid">
        <div class="overview-card">
          <div class="ov-label">Grades</div>
          <div class="ov-number">${lv.grades.length}</div>
        </div>
        <div class="overview-card">
          <div class="ov-label">Chapters</div>
          <div class="ov-number">${totalChapters}</div>
        </div>
        <div class="overview-card">
          <div class="ov-label">Topics</div>
          <div class="ov-number">${stats.total}</div>
        </div>
        <div class="overview-card">
          <div class="ov-label">Videos</div>
          <div class="ov-number">${stats.withVideo}</div>
          <div class="ov-detail">${pct}% complete</div>
          <div class="progress-bar-wrap">
            <div class="progress-bar-fill" style="width:${pct}%"></div>
          </div>
        </div>
      </div>

      <h3 style="color:var(--text-secondary);margin-bottom:16px;font-size:1rem;">Chapters</h3>
      ${renderOverviewChapterList(lv)}
    </div>
  `;
  main.scrollTop = 0;
}

function renderOverviewChapterList(lv) {
  let html = '';
  lv.grades.forEach((grade, gi) => {
    grade.semesters.forEach((sem, si) => {
      sem.chapters.forEach((ch, ci) => {
        const vidCount = ch.topics.filter(t => t.hasVideo).length;
        const path = `${currentLevel}/${gi}/${si}/${ci}`;
        html += `
          <div class="search-result-item" onclick="selectChapter('${path}');renderSidebar();">
            <div>
              <div class="sr-name">${ch.chapterShort}</div>
              <div class="sr-path">${grade.name}${sem.name ? ' / ' + sem.name : ''}</div>
            </div>
            <div class="sr-badge">
              <span class="card-badge ${vidCount === ch.topics.length ? 'badge-video' : 'badge-no-video'}">
                ${vidCount}/${ch.topics.length}
              </span>
            </div>
          </div>`;
      });
    });
  });
  return html;
}

// ─── Search ───
let searchTimeout = null;
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('searchInput').addEventListener('input', (e) => {
    clearTimeout(searchTimeout);
    const q = e.target.value.trim();
    if (!q) {
      if (currentChapterPath) {
        const [li, gi, si, ci] = currentChapterPath.split('/').map(Number);
        const lv = CATALOG.levels[li];
        renderChapter(lv, lv.grades[gi], lv.grades[gi].semesters[si], lv.grades[gi].semesters[si].chapters[ci]);
      } else {
        renderOverview();
      }
      return;
    }
    searchTimeout = setTimeout(() => performSearch(q), 200);
  });
});

function performSearch(query) {
  const q = query.toLowerCase();
  const results = [];

  CATALOG.levels.forEach((lv, li) => {
    lv.grades.forEach((grade, gi) => {
      grade.semesters.forEach((sem, si) => {
        sem.chapters.forEach((ch, ci) => {
          ch.topics.forEach(topic => {
            if (topic.name.toLowerCase().includes(q) ||
                topic.docstring.toLowerCase().includes(q) ||
                ch.name.toLowerCase().includes(q)) {
              results.push({
                topic,
                path: `${li}/${gi}/${si}/${ci}`,
                breadcrumb: `${lv.name} / ${grade.name}${sem.name ? ' / ' + sem.name : ''} / ${ch.chapterShort}`,
              });
            }
          });
        });
      });
    });
  });

  const main = document.getElementById('main');
  if (results.length === 0) {
    main.innerHTML = `<div class="search-results"><h3>No results for "<b>${escHtml(query)}</b>"</h3></div>`;
    return;
  }

  let html = `<div class="search-results"><h3><b>${results.length}</b> results for "<b>${escHtml(query)}</b>"</h3>`;
  results.slice(0, 100).forEach(r => {
    html += `
      <div class="search-result-item" onclick="selectChapter('${r.path}');renderSidebar();">
        <div>
          <div class="sr-name">${r.topic.name}</div>
          <div class="sr-path">${r.breadcrumb}</div>
        </div>
        <div class="sr-badge">
          <span class="card-badge ${r.topic.hasVideo ? 'badge-video' : 'badge-no-video'}">
            ${r.topic.hasVideo ? 'VIDEO' : 'PENDING'}
          </span>
        </div>
      </div>`;
  });
  html += '</div>';
  main.innerHTML = html;
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Boot
loadCatalog();
</script>
</body>
</html>
