name: Grade 8 consolidated linear function checks

on:
  pull_request:
    paths:
      - '初中/八年级/第二学期/第二十章-一次函数/**'
      - '.github/workflows/grade8-linear-consolidated.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linear-function-math:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /初中/八年级/第二学期/第二十章-一次函数/**/*.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all linear function lessons
        run: python -m compileall -q '初中/八年级/第二学期/第二十章-一次函数'
      - name: Run all lesson-specific mathematical regression scripts
        shell: bash
        run: |
          set -euo pipefail
          chapter='初中/八年级/第二学期/第二十章-一次函数'
          count=0
          while IFS= read -r -d '' test_file; do
            echo "Running: $test_file"
            python "$test_file"
            count=$((count + 1))
          done < <(find "$chapter" -type f -name 'verify_*.py' -print0 | sort -z)
          if [ "$count" -lt 5 ]; then
            echo "Expected five chapter regression files (including merged lesson 001), found $count" >&2
            exit 1
          fi
          echo "Executed $count linear-function regression scripts"
