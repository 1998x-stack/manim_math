name: Grade 11 S2 curve and equation

on:
  pull_request:
    paths:
      - '高中/高二/第二学期/第十二章-圆锥曲线/001曲线与方程/**'
      - '.github/workflows/grade11-s2-curve-equation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  circle-equation-math-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            高中/高二/第二学期/第十二章-圆锥曲线/001曲线与方程
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile source and test circle-equation model without Manim
        env:
          LESSON: 高中/高二/第二学期/第十二章-圆锥曲线/001曲线与方程
        run: |
          python -m py_compile "$LESSON/curve_and_equation.py" "$LESSON/verify_curve_and_equation.py"
          python "$LESSON/verify_curve_and_equation.py" -v
