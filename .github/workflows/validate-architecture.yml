name: Validate docs, skills and catalog contract
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'catalog/**'
      - 'skills/**'
      - '.codex/skills/**'
      - '.opencode/skills/**'
      - '.claude/skills/**'
      - 'tools/**'
      - 'tests/**'
      - 'assets/catalog.json'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/workflows/validate-architecture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            .codex/skills
            .opencode/skills
            .claude/skills
            assets/catalog.json
            catalog
            docs
            skills
            tools
            tests
            README.md
            AGENTS.md
            # Unit tests inspect actual lesson sources and JSON geometry; course MP4 remain excluded.
            小学/奥数专题
            小学/一年级/上册/第一章-10以内数的认识/001数一数/counting_animation.py
            小学/一年级/下册/第二章-100以内数的认识/003百数表/003_百数表.py
            小学/一年级/上册/第二章-10以内数的加减法/005连加、连减、加减混合/005_连加、连减、加减混合.py
            小学/四年级/第一学期/第三章-数的运算——三位数乘两位数/001笔算乘法(竖式计算)/001_笔算乘法(竖式计算).py
            小学/四年级/第一学期/第三章-数的运算——三位数乘两位数/001笔算乘法_竖式计算__animation.py
            小学/四年级/第一学期/第三章-数的运算——三位数乘两位数/001笔算乘法(竖式计算)/001笔算乘法_竖式计算__animation.py
            小学/五年级/第一学期/第三章-统计/001平均数的意义/001平均数的意义_animation.py
            小学/五年级/第一学期/第四章-简易方程(一)/003等式的性质/003等式的性质_animation.py
            小学/五年级/第一学期/第五章-几何小实践/005等面积法-同底等高/lesson.py
            小学/五年级/第一学期/第五章-几何小实践/005等面积法-同底等高/area_model.py
            小学/五年级/第一学期/第五章-几何小实践/005等面积法-同底等高/test_area_model.py
            小学/五年级/第一学期/第五章-几何小实践/005等面积法-同底等高/geometry_spec.json
            小学/五年级/第一学期/第五章-几何小实践/006等面积法-梯形蝴蝶模型/lesson.py
            小学/五年级/第一学期/第五章-几何小实践/006等面积法-梯形蝴蝶模型/area_model.py
            小学/五年级/第一学期/第五章-几何小实践/006等面积法-梯形蝴蝶模型/test_area_model.py
            小学/五年级/第一学期/第五章-几何小实践/006等面积法-梯形蝴蝶模型/geometry_spec.json
            小学/五年级/第二学期/第三章-分数的意义和性质/001单位'1'/001单位_1__animation.py
            初中/七年级/第一学期/第九章-整式/003整式的加减法/003_整式的加减法.py
            初中/八年级/第一学期/第十七章-一元二次方程/001一元二次方程的概念/001_一元二次方程的概念.py
            初中/八年级/第一学期/第十九章-几何证明/008勾股定理的逆定理/pythagorean_inverse.py
            初中/八年级/第二学期/第二十三章-概率初步/004频率与概率的关系/probability_frequency.py
            高中/高二/第二学期/第十三章-复数/004复数的平方根与立方根/complex_roots.py
            高中/高二/第二学期/第十三章-复数/004复数的平方根与立方根/description.json
            高中/高一/第一学期/第一章-集合与命题/002集合间的关系/verify_sets.py
            高中/高一/第一学期/第一章-集合与命题/003集合的运算/set_operations.py
            高中/高一/第一学期/第一章-集合与命题/003集合的运算/verify_set_operations.py
            高中/高一/第一学期/第一章-集合与命题/004四种命题及其关系/four_propositions.py
            高中/高一/第一学期/第一章-集合与命题/004四种命题及其关系/verify_four_propositions.py
            高中/高一/第一学期/第一章-集合与命题/005充分条件与必要条件/sufficient_necessary_conditions.py
            高中/高一/第一学期/第一章-集合与命题/005充分条件与必要条件/verify_conditions_scene.py
            高中/高一/第二学期/第六章-三角函数/003函数y=Asin(ωx+φ)的图像与性质/verify_geometry.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Probability math regression tests use NumPy, but do not import Manim.
      - run: python -m pip install numpy==1.26.4
      - run: python tools/sync_skills.py --check
      - run: python tools/check_repository.py
      - run: python tools/audit_catalog.py --skip-file-check
      - run: python tools/legacy_contract.py --expect-count 534
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
