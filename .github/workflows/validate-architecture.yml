name: Validate docs, skills and catalog contract
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'catalog/**'
      - 'skills/**'
      - '.codex/skills/**'
      - '.opencode/skills/**'
      - '.claude/skills/**'
      - '.pi/skills/**'
      - 'tools/**'
      - 'tests/**'
      - 'assets/catalog.json'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/workflows/validate-architecture.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            .codex/skills
            .pi/skills
            .opencode/skills
            .claude/skills
            assets/catalog.json
            assets/build_catalog.py
            catalog
            docs
            skills
            tools
            tests
            README.md
            AGENTS.md
            # Unit tests inspect actual lesson sources and JSON geometry; course MP4 remain excluded.
