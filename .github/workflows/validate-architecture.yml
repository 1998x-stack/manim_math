name: Validate docs, skills and catalog contract
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'catalog/**'
      - 'skills/**'
      - '.codex/skills/**'
      - '.opencode/skills/**'
      - '.claude/skills/**'
      - 'tools/**'
      - 'tests/**'
      - 'assets/catalog.json'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/workflows/validate-architecture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            .codex/skills
            .opencode/skills
            .claude/skills
            assets/catalog.json
            catalog
            docs
            skills
            tools
            tests
            README.md
            AGENTS.md
            # Three grade-one scene sources are needed by AST-based regression tests.
            # Only source files are fetched; course MP4 media remain excluded.
            小学/一年级/上册/第一章-10以内数的认识/001数一数/counting_animation.py
            小学/一年级/下册/第二章-100以内数的认识/003百数表/003_百数表.py
            小学/一年级/上册/第二章-10以内数的加减法/005连加、连减、加减混合/005_连加、连减、加减混合.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/sync_skills.py --check
      - run: python tools/check_repository.py
      - run: python tools/audit_catalog.py --skip-file-check
      - run: python tools/legacy_contract.py --expect-count 534
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
