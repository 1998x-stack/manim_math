name: Validate docs, skills and catalog contract
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'catalog/**'
      - 'skills/**'
      - '.codex/skills/**'
      - '.opencode/skills/**'
      - '.claude/skills/**'
      - 'tools/**'
      - 'tests/**'
      - 'assets/catalog.json'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/workflows/validate-architecture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            .codex/skills
            .opencode/skills
            .claude/skills
            assets/catalog.json
            catalog
            docs
            skills
            tools
            tests
            README.md
            AGENTS.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/sync_skills.py --check
      - run: python tools/check_repository.py
      - run: python tools/audit_catalog.py --skip-file-check
      - run: python tools/legacy_contract.py --expect-count 534
      # Sparse checkout intentionally excludes course directories; tests use fixtures.
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
