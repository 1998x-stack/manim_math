name: Grade 8 term 1 radical properties

on:
  pull_request:
    paths:
      - "初中/八年级/第一学期/第十六章-二次根式/002二次根式的性质/**"
      - ".github/workflows/grade8-term1-radical-properties.yml"
      - ".opencode/skills/manim-video-production/scripts/audit_scene.py"
  workflow_dispatch:

jobs:
  radical-properties-math-and-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /初中/八年级/第一学期/第十六章-二次根式/002二次根式的性质/*.py
            /.opencode/skills/manim-video-production/scripts/audit_scene.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate syntax of the actual Manim scene
        run: python -m py_compile "初中/八年级/第一学期/第十六章-二次根式/002二次根式的性质/radical_properties.py"
      - name: Verify exact lesson mathematics and scene contracts without Manim
        run: python -m unittest discover -s "初中/八年级/第一学期/第十六章-二次根式/002二次根式的性质" -p 'test_radical_properties_math.py' -v
      - name: Check the Skill's known-error AST rules
        run: python .opencode/skills/manim-video-production/scripts/audit_scene.py "初中/八年级/第一学期/第十六章-二次根式/002二次根式的性质/radical_properties.py" --json
