name: High-school historical gotchas audit

on:
  push:
    branches:
      - fix/highschool-historical-gotchas-20260923
  pull_request:
    paths:
      - '高中/**/*.py'
      - 'tools/audit_highschool_gotchas.py'
      - 'tools/audit_junior_gotchas.py'
      - 'tools/tests/test_highschool_gotchas.py'
      - 'tools/repair_highschool_gotchas.py'
      - '.github/workflows/highschool-gotchas-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /高中/**/*.py
            /tools/audit_highschool_gotchas.py
            /tools/audit_junior_gotchas.py
            /tools/repair_highschool_gotchas.py
            /tools/tests/test_highschool_gotchas.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all three grades and test repaired scenes
        run: |
          python -m compileall -q '高中'
          python -m unittest discover -s tools/tests -p 'test_highschool_gotchas.py' -v
      - name: Scan all high-school lessons without importing Manim
        shell: bash
        run: |
          python tools/audit_highschool_gotchas.py --strict --json > highschool-gotchas.json || status=$?
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          data = json.loads(Path('highschool-gotchas.json').read_text(encoding='utf-8'))
          print('Grade counts:', data['grades'], 'files:', data['files'])
          print('Errors:', data['errors'], 'Warnings:', data['warnings'],
                'Ctex reviews:', data['information'])
          print('Rule counts:', dict(Counter(row['code'] for row in data['findings'])))
          for issue in data['findings'][:160]:
              print(f"{issue['path']}:{issue['line']} [{issue['severity']}] {issue['code']}")
          assert all(data['grades'].values()), 'Grade missing or checkout incomplete'
          assert data['files'] >= 131, 'Coverage unexpectedly decreased'
          PY
          exit "${status:-0}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: highschool-historical-gotchas
          path: highschool-gotchas.json
          if-no-files-found: warn
