name: Grade 8 term 2 lesson 002 preview

on:
  pull_request:
    paths:
      - "初中/八年级/第二学期/第二十章-一次函数/002一次函数的图像/**"
      - ".github/workflows/grade8-term2-002-preview.yml"
  workflow_dispatch:

jobs:
  render-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /初中/八年级/第二学期/第二十章-一次函数/002一次函数的图像/linear_function_graph.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Manim and TeX render dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq pkg-config libcairo2-dev libpango1.0-dev ffmpeg texlive-latex-extra texlive-fonts-recommended dvisvgm fonts-noto-cjk
          python -m pip install 'manim==0.19.0'
          manim --version
      - name: Render complete seven-scene preview
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('初中/八年级/第二学期/第二十章-一次函数/002一次函数的图像/linear_function_graph.py')
          text = source.read_text(encoding='utf-8')
          # 只覆盖预览像素分辨率；保持 9×16 的场景单位、七镜代码和数学模型不变。
          text = text.replace('config.pixel_width = 1080\n', '').replace('config.pixel_height = 1920\n', '')
          Path('/tmp/linear_function_graph_preview.py').write_text(text, encoding='utf-8')
          PY
          manim -ql -r 270,480 --disable_caching --media_dir /tmp/manim-grade8-preview /tmp/linear_function_graph_preview.py LinearFunctionGraph
          VIDEO=$(find /tmp/manim-grade8-preview -type f -name 'LinearFunctionGraph.mp4' | head -n 1)
          test -n "$VIDEO"
          ffprobe -v error -show_entries stream=codec_type,width,height -show_entries format=duration -of json "$VIDEO"
      - name: Upload rendered preview for visual inspection
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: grade8-term2-002-preview
          path: /tmp/manim-grade8-preview/**/LinearFunctionGraph.mp4
          retention-days: 7
