name: Manim equal-area real render smoke

on:
  pull_request:
    paths:
      - '.github/workflows/manim-equal-area-preview.yml'
  workflow_dispatch:

jobs:
  preview-real-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            小学/五年级/第一学期/第五章-几何小实践/005等面积法-同底等高/lesson.py
            小学/五年级/第一学期/第五章-几何小实践/005等面积法-同底等高/area_model.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Manim, LaTeX, ffmpeg and Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg pkg-config libcairo2-dev libpango1.0-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm fonts-noto-cjk
          python -m pip install 'manim==0.19.0' 'numpy==1.26.4'
          manim --version
          ffprobe -version | head -1
      - name: Render existing lesson as a 270x480 portrait preview
        env:
          MANIM_PREVIEW: '1'
        run: |
          set -euo pipefail
          lesson='小学/五年级/第一学期/第五章-几何小实践/005等面积法-同底等高/lesson.py'
          python -m manim render -r 270,480 --fps 15 --media_dir "$RUNNER_TEMP/manim-real-preview" -o equal-area-preview "$lesson" EqualAreaMovingApex
          python - "$RUNNER_TEMP/manim-real-preview" <<'PY'
          import json, pathlib, subprocess, sys
          files = list(pathlib.Path(sys.argv[1]).rglob('equal-area-preview.mp4'))
          assert len(files) == 1, f'expected one new video, got {files}'
          payload = json.loads(subprocess.check_output(['ffprobe', '-v', 'error', '-show_entries', 'stream=codec_type,width,height,r_frame_rate', '-show_entries', 'format=duration', '-of', 'json', str(files[0])], text=True))
          streams = [s for s in payload['streams'] if s['codec_type'] == 'video']
          assert len(streams) == 1 and streams[0]['width'] == 270 and streams[0]['height'] == 480, payload
          assert float(payload['format']['duration']) > 0, payload
          print('PASS real Manim equal-area scene: 270x480 portrait MP4, duration', payload['format']['duration'], 's, fps', streams[0]['r_frame_rate'])
          PY
      - name: Publish preview and diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manim-equal-area-preview
          path: ${{ runner.temp }}/manim-real-preview
          if-no-files-found: warn
