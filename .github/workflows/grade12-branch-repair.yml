name: Grade 12 one-time branch repair

on:
  push:
    branches:
      - fix/grade12-math-audit-20260923
    paths:
      - .github/workflows/grade12-branch-repair.yml

permissions:
  contents: write

jobs:
  apply-reviewed-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            高中/高三/tools
            高中/高三/tests
            高中/高三/第二学期/第十七章-概率论初步/003频率与概率
            高中/高三/第二学期/第十七章-概率论初步/005条件概率与独立事件
            高中/高三/第一学期/第十五章-简单几何体/001多面体的概念
      - name: Apply exact, fail-closed source repairs
        run: python '高中/高三/tools/repair_known_issues.py' --apply
      - name: Offline regression tests and syntax checks
        run: |
          python -m unittest discover -s '高中/高三/tests' -v
          python '高中/高三/tools/audit_grade12.py'
          git diff --check
      - name: Commit three lesson source fixes to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '高中/高三/第二学期/第十七章-概率论初步/003频率与概率/freq_prob_animation.py' \
                     '高中/高三/第二学期/第十七章-概率论初步/005条件概率与独立事件/cond_prob_animation.py' \
                     '高中/高三/第一学期/第十五章-简单几何体/001多面体的概念/polyhedron_concepts.py'
          if ! git diff --cached --quiet; then
            git commit -m 'fix(grade12): correct probability result and isolate simulation RNG'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
