name: Video build real-render smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feat/commit-gotchas-video-pipeline-20260923
    paths:
      - '.github/workflows/video-build-smoke.yml'

permissions:
  contents: read

jobs:
  real-render-and-mux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/build_video.py
            /tools/tests/fixtures/video_smoke.py
            /.gitignore
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ephemeral runner system prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libcairo2-dev libpango1.0-dev pkg-config fonts-dejavu-core
      - name: Generate test-only music, render a Scene and atomically create MP4
        run: |
          ffmpeg -nostdin -loglevel error -y -f lavfi -i 'sine=frequency=440:duration=2' -q:a 5 tools/tests/fixtures/smoke-music.mp3
          python tools/build_video.py tools/tests/fixtures/video_smoke.py VideoBuildSmoke \
            --install --music tools/tests/fixtures/smoke-music.mp3 \
            --output tools/tests/fixtures/video-smoke-finish.mp4 --quality l --force
          test -s tools/tests/fixtures/video-smoke-finish.mp4
          test ! -d tools/tests/fixtures/media
          test -z "$(find tools/tests/fixtures -maxdepth 1 -name '.manim-build-*' -print -quit)"
      - name: Assert resulting video and audio streams with ffprobe
        run: |
          python - <<'PY'
          import json, subprocess
          path = 'tools/tests/fixtures/video-smoke-finish.mp4'
          result = subprocess.run(['ffprobe', '-v', 'error', '-show_entries',
                                   'stream=codec_type:format=duration', '-of', 'json', path],
                                  capture_output=True, text=True, check=True)
          probe = json.loads(result.stdout)
          kinds = {stream['codec_type'] for stream in probe['streams']}
          assert {'video', 'audio'} <= kinds, kinds
          assert float(probe['format']['duration']) > 0, probe['format']
          print('Actual Manim render and FFmpeg audio merge validated:', kinds,
                'duration:', probe['format']['duration'])
          PY
