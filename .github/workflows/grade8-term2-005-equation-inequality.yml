name: Grade 8 term 2 lesson 005 equation inequality

on:
  pull_request:
    paths:
      - "初中/八年级/第二学期/第二十章-一次函数/005一次函数与方程、不等式的关系/**"
      - ".github/workflows/grade8-term2-005-equation-inequality.yml"
  workflow_dispatch:

jobs:
  check-lesson-005:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /初中/八年级/第二学期/第二十章-一次函数/005一次函数与方程、不等式的关系/*.py
            /.opencode/skills/manim-video-production/scripts/audit_scene.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify lesson 005 mathematical model, syntax, and AST
        run: |
          python -m py_compile "初中/八年级/第二学期/第二十章-一次函数/005一次函数与方程、不等式的关系/linear_function_equation_inequality.py" "初中/八年级/第二学期/第二十章-一次函数/005一次函数与方程、不等式的关系/verify_linear_function_equation_inequality.py"
          python "初中/八年级/第二学期/第二十章-一次函数/005一次函数与方程、不等式的关系/verify_linear_function_equation_inequality.py"
          python .opencode/skills/manim-video-production/scripts/audit_scene.py "初中/八年级/第二学期/第二十章-一次函数/005一次函数与方程、不等式的关系/linear_function_equation_inequality.py" --json
