name: Primary equal-area actual render

on:
  pull_request:
    paths:
      - '小学/五年级/第一学期/第五章-几何小实践/005等面积法-同底等高/**'
      - '小学/五年级/第一学期/第五章-几何小实践/006等面积法-梯形蝴蝶模型/**'
      - '.github/workflows/primary-equal-area-render.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-portrait-previews:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /小学/五年级/第一学期/第五章-几何小实践/005等面积法-同底等高
            /小学/五年级/第一学期/第五章-几何小实践/006等面积法-梯形蝴蝶模型
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Manim, LaTeX, Chinese font and ffprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libcairo2-dev libpango1.0-dev pkg-config \
            texlive-latex-extra texlive-fonts-recommended dvisvgm fonts-noto-cjk
          python -m pip install 'manim==0.19.0'
          manim --version
          ffprobe -version | head -1
      - name: Render both real Manim scenes (270x480 / 15fps preview)
        env:
          MANIM_PREVIEW: '1'
        run: |
          set -eu
          chapter='小学/五年级/第一学期/第五章-几何小实践'
          ( cd "$chapter/005等面积法-同底等高" && \
            manim --disable_caching --media_dir "$RUNNER_TEMP/equal-area-005" \
            -o equal-area-005 lesson.py EqualAreaMovingApex )
          ( cd "$chapter/006等面积法-梯形蝴蝶模型" && \
            manim --disable_caching --media_dir "$RUNNER_TEMP/equal-area-006" \
            -o equal-area-006 lesson.py TrapezoidButterflyArea )
      - name: Verify real video dimensions, frame rate and nonzero duration
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          for idx in ('005', '006'):
              root = pathlib.Path(os.environ['RUNNER_TEMP']) / f'equal-area-{idx}'
              paths = list(root.rglob(f'equal-area-{idx}.mp4'))
              assert len(paths) == 1, (idx, paths)
              result = subprocess.run(
                  ['ffprobe', '-v', 'error', '-show_entries',
                   'stream=codec_type,width,height,r_frame_rate:format=duration',
                   '-of', 'json', str(paths[0])], capture_output=True,
                  text=True, check=True)
              data = json.loads(result.stdout)
              videos = [s for s in data['streams'] if s['codec_type'] == 'video']
              assert len(videos) == 1, data
              video = videos[0]
              assert (video['width'], video['height']) == (270, 480), video
              assert video['r_frame_rate'] == '15/1', video
              assert float(data['format']['duration']) >= 10, data
              print(idx, paths[0], video['width'], video['height'],
                    video['r_frame_rate'], data['format']['duration'])
          PY
      - name: Publish preview videos for manual visual review
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: primary-equal-area-two-real-previews
          path: |
            ${{ runner.temp }}/equal-area-005/videos/**/*.mp4
            ${{ runner.temp }}/equal-area-006/videos/**/*.mp4
          if-no-files-found: error
