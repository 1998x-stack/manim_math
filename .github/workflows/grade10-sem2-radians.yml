name: Grade 10 semester 2 radians checks

on:
  pull_request:
    paths:
      - '高中/高一/第二学期/第五章-三角比/001任意角与弧度制/**'
      - '.github/workflows/grade10-sem2-radians.yml'
      - '.opencode/skills/manim-video-production/scripts/audit_scene.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  math-and-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /高中/高一/第二学期/第五章-三角比/001任意角与弧度制/
            /.opencode/skills/manim-video-production/scripts/audit_scene.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and verify radians mathematics
        run: |
          LESSON='高中/高一/第二学期/第五章-三角比/001任意角与弧度制'
          python -m py_compile "$LESSON/001_任意角与弧度制.py" "$LESSON/verify_radians.py"
          python "$LESSON/verify_radians.py" -v
      - name: Manim skill AST audit
        run: |
          LESSON='高中/高一/第二学期/第五章-三角比/001任意角与弧度制'
          python .opencode/skills/manim-video-production/scripts/audit_scene.py "$LESSON/001_任意角与弧度制.py" --json > /tmp/radians-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/radians-audit.json').read_text(encoding='utf-8'))
          print('AST:', report['errors'], 'errors,', report['warnings'], 'warnings')
          for finding in report['findings']:
              print(finding)
          assert report['errors'] == 0
          assert {row['code'] for row in report['findings']} <= {'DYNAMIC_TEX'}
          PY
