name: ManimGX migration guard

on:
  push:
    branches:
      - feat/manimgx-migration-v1
  pull_request:
    paths:
      - "**/*.py"
      - "requirements-manimgx*.txt"
      - "tools/manimgx_*.py"
      - "manim_math_gx/**"
      - "skills/source/manim-video-production/**"
      - ".codex/skills/manim-video-production/**"
      - ".opencode/skills/manim-video-production/**"
      - ".claude/skills/manim-video-production/**"
      - ".github/workflows/manimgx-migration.yml"

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-manimgx-dev.txt
      - name: Install ManimGX migration toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-manimgx-dev.txt
      - name: Validate canonical animation skill and mirrors
        run: |
          python tools/sync_skills.py --check
          (cd skills/source/manim-video-production && python -m unittest discover -s scripts -p 'test_*.py' -v)
      - name: Compile migration tooling and representative scenes
        run: |
          python -m compileall -q manim_math_gx tools/manimgx_audit.py tools/manimgx_migrate.py
          python -m py_compile external/euler_line.py
          python -m py_compile "高中/高二/第二学期/第十二章-圆锥曲线/002圆的方程/circle_equation.py"
      - name: Runtime profile smoke test
        run: |
          python - <<'PY'
          import manimgx as m
          from manim_math_gx import PORTRAIT_1080P, assert_profile, configure_render
          configure_render()
          assert_profile()
          assert (m.config.pixel_width, m.config.pixel_height) == (1080, 1920)
          assert abs(m.config.frame_width - PORTRAIT_1080P.frame_width) < 1e-9
          print("ManimGX portrait profile OK", m.config.frame_width, m.config.frame_height)
          PY
      - name: Type-check representative migrated scenes
        run: |
          ty check external/euler_line.py
          ty check "高中/高二/第二学期/第十二章-圆锥曲线/002圆的方程/circle_equation.py"
      - name: Inspect representative existing Scene with ManimGX
        env:
          MANIM_MATH_CJK_FONT: sans-serif
        run: |
          manimgx inspect "高中/高二/第二学期/第十二章-圆锥曲线/002圆的方程/circle_equation.py" CircleEquation -t 0,end
      - name: Render representative MP4 with ManimGX
        env:
          MANIM_MATH_CJK_FONT: sans-serif
        run: |
          output="$RUNNER_TEMP/CircleEquation.manimgx-smoke.mp4"
          manimgx render "高中/高二/第二学期/第十二章-圆锥曲线/002圆的方程/circle_equation.py" CircleEquation \
            -r 270x480 --fps 15 -o "$output"
          test -s "$output"
          ls -lh "$output"
      - name: Report remaining migration debt
        if: always()
        continue-on-error: true
        run: python tools/manimgx_audit.py . --strict
