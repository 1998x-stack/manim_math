name: A-Level P1 quadratics consolidated source and math tests

on:
  pull_request:
    paths:
      - '高中/A-Level/P1/01-Quadratics/**'
      - '高中/A-Level/README.md'
      - '.github/workflows/alevel-p1-quadratics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quadratic-lessons:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /高中/A-Level/P1/01-Quadratics/**/*.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile A-Level P1 lesson sources
        run: python -m compileall -q '高中/A-Level/P1/01-Quadratics'
      - name: Run each consolidated lesson mathematics suite
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for lesson in \
            '高中/A-Level/P1/01-Quadratics/03-quadratic-formula' \
            '高中/A-Level/P1/01-Quadratics/04-linear-quadratic-simultaneous' \
            '高中/A-Level/P1/01-Quadratics/05-complex-quadratic-equations' \
            '高中/A-Level/P1/01-Quadratics/06-quadratic-extrema'; do
            test -f "$lesson/test_math.py" || { echo "Missing mathematics regression: $lesson" >&2; exit 1; }
            (cd "$lesson" && python -m unittest -v test_math.py)
            count=$((count + 1))
          done
          test "$count" -eq 4 || { echo "Expected four P1 chapter one suites; got $count" >&2; exit 1; }
