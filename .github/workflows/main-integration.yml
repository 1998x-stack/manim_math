name: Main integration quality gate

on:
  pull_request:
    paths:
      - 'tools/test_platform.py'
      - 'tools/media_probe.py'
      - 'tools/render_smoke.sh'
      - 'tests/test_manifest.json'
      - 'tests/test_test_platform.py'
      - 'tests/test_media_probe.py'
      - '.github/workflows/main-integration.yml'
      - '.github/workflows/pr-changed-render.yml'
      - '.github/workflows/main-render-smoke.yml'
      - '.github/workflows/nightly-render-matrix.yml'
      - 'docs/engineering/testing-strategy.md'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/test_platform.py
            /tools/media_probe.py
            /tools/render_smoke.sh
            /tests/test_manifest.json
            /tests/test_test_platform.py
            /tests/test_media_probe.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile control plane
        run: |
          python -m py_compile tools/test_platform.py tools/media_probe.py tests/test_test_platform.py tests/test_media_probe.py
          bash -n tools/render_smoke.sh
      - name: Validate test manifest
        run: python tools/test_platform.py validate --skip-source-check
      - name: Verify registered render sources exist in Git tree
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r source; do
            found="$(git -c core.quotePath=false ls-tree -r --name-only "$GITHUB_SHA" -- "$source")"
            [[ "$found" == "$source" ]] || { echo "Missing registered render source: $source" >&2; exit 1; }
          done < <(python tools/test_platform.py sources)
      - name: Run control-plane regressions
        run: python -m unittest tests.test_test_platform tests.test_media_probe -v
      - name: Classify changed lesson paths
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
          python tools/test_platform.py changed-lessons --paths-file "$RUNNER_TEMP/changed-files.txt" | tee "$RUNNER_TEMP/changed-lessons.txt"
          python tools/test_platform.py changed-matrix --paths-file "$RUNNER_TEMP/changed-files.txt"

  repository-tests:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight mathematics dependency
        run: python -m pip install numpy==1.26.4
      - name: Repository unit and contract suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Historical tooling regression suite
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v
