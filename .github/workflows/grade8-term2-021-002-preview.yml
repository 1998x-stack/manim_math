name: Grade 8 term 2 chapter 21 fractional preview

on:
  pull_request:
    paths:
      - "初中/八年级/第二学期/第二十一章-代数方程/002分式方程/**"
      - ".github/workflows/grade8-term2-021-002-preview.yml"
  workflow_dispatch:

jobs:
  render-fractional:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /初中/八年级/第二学期/第二十一章-代数方程/002分式方程/fractional_equation_animation.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Manim and TeX
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq pkg-config libcairo2-dev libpango1.0-dev ffmpeg texlive-latex-extra texlive-fonts-recommended dvisvgm fonts-noto-cjk
          python -m pip install 'manim==0.19.0'
          manim --version
      - name: Render complete seven-scene preview
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('初中/八年级/第二学期/第二十一章-代数方程/002分式方程/fractional_equation_animation.py')
          text = source.read_text(encoding='utf-8')
          text = text.replace('config.pixel_width = 1080\n', '').replace('config.pixel_height = 1920\n', '')
          Path('/tmp/fractional_equation_preview.py').write_text(text, encoding='utf-8')
          PY
          manim -ql -r 270,480 --disable_caching --media_dir /tmp/manim-fractional-preview /tmp/fractional_equation_preview.py FractionalEquation
          VIDEO=$(find /tmp/manim-fractional-preview -type f -name 'FractionalEquation.mp4' | head -n 1)
          test -n "$VIDEO"
          ffprobe -v error -show_entries stream=codec_type,width,height -show_entries format=duration -of json "$VIDEO"
      - name: Upload preview for frame review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: grade8-term2-fractional-preview
          path: /tmp/manim-fractional-preview/**/FractionalEquation.mp4
          retention-days: 7
