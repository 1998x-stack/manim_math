name: High-school one-shot guarded source repair

on:
  push:
    branches:
      - fix/highschool-historical-gotchas-20260923
    paths:
      - 'tools/repair_highschool_gotchas.py'
      - 'tools/tests/test_highschool_gotchas.py'
      - '.github/workflows/highschool-one-shot-repair.yml'

permissions:
  contents: write

jobs:
  apply-three-reviewed-scenes:
    if: github.repository == '1998x-stack/manim_math' && github.ref == 'refs/heads/fix/highschool-historical-gotchas-20260923'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/highschool-historical-gotchas-20260923
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /高中/**/*.py
            /tools/audit_junior_gotchas.py
            /tools/audit_highschool_gotchas.py
            /tools/repair_highschool_gotchas.py
            /tools/tests/test_highschool_gotchas.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply only guarded three-file patch
        run: python tools/repair_highschool_gotchas.py --apply
      - name: Verify all high-school lessons and repaired mathematical contracts
        shell: bash
        run: |
          python -m compileall -q '高中'
          python -m unittest discover -s tools/tests -p 'test_highschool_gotchas.py' -v
          python tools/audit_highschool_gotchas.py --json > highschool-fixed-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('highschool-fixed-audit.json').read_text(encoding='utf-8'))
          print('FILES', report['files'], 'GRADES', report['grades'])
          print('ERRORS', report['errors'], 'WARNINGS', report['warnings'],
                'CTEX_REVIEW', report['information'])
          assert report['files'] == 131 and report['errors'] == 0 and report['warnings'] == 0
          assert report['information'] == 3
          PY
          git diff --check
      - name: Commit only reviewed scene files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- '高中'
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'fix(highschool): correct two degree labels and 19 sine scene Tex calls'
          git push origin HEAD:refs/heads/fix/highschool-historical-gotchas-20260923
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: highschool-fixed-audit
          path: highschool-fixed-audit.json
          if-no-files-found: warn
