name: PR changed lesson render gate

on:
  pull_request:
    paths:
      - '小学/**/*.py'
      - '小学/**/*.json'
      - '小学/**/*.md'
      - '初中/**/*.py'
      - '初中/**/*.json'
      - '初中/**/*.md'
      - '高中/**/*.py'
      - '高中/**/*.json'
      - '高中/**/*.md'
      - 'tests/test_manifest.json'
      - 'tools/test_platform.py'
      - 'tools/media_probe.py'
      - 'tools/render_smoke.sh'
      - '.github/workflows/pr-changed-render.yml'
      - '.github/workflows/main-render-smoke.yml'
      - '.github/workflows/nightly-render-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix || steps.manual.outputs.matrix }}
      count: ${{ steps.select.outputs.count || steps.manual.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          filter: blob:none
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate render manifest
        run: python tools/test_platform.py validate
      - id: select
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
          matrix="$(python tools/test_platform.py changed-matrix --paths-file "$RUNNER_TEMP/changed-files.txt")"
          count="$(python -c 'import json,sys; print(len(json.loads(sys.argv[1])["include"]))' "$matrix")"
          if [[ "$count" == "0" ]] && grep -Eq '^(tests/test_manifest\.json|tools/test_platform\.py|tools/media_probe\.py|tools/render_smoke\.sh|\.github/workflows/(pr-changed-render|main-render-smoke|nightly-render-matrix)\.yml)$' "$RUNNER_TEMP/changed-files.txt"; then
            matrix="$(python tools/test_platform.py matrix --tier pr)"
            count="$(python -c 'import json,sys; print(len(json.loads(sys.argv[1])["include"]))' "$matrix")"
            echo "render infrastructure changed; using PR representative tier"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "registered renders: $count"
      - id: manual
        if: github.event_name == 'workflow_dispatch'
        run: |
          matrix="$(python tools/test_platform.py matrix --tier nightly)"
          count="$(python -c 'import json,sys; print(len(json.loads(sys.argv[1])["include"]))' "$matrix")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

  render:
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Manim render dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg pkg-config libcairo2-dev libpango1.0-dev texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm fonts-noto-cjk
          python -m pip install 'manim==0.19.2'
      - name: Render changed or representative Scene
        run: bash tools/render_smoke.sh '${{ matrix.source }}' '${{ matrix.scene }}' '${{ matrix.width }}' '${{ matrix.height }}' '${{ matrix.id }}'
      - name: Upload PR render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-render-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/render-${{ matrix.id }}/videos/**/*.mp4
            ${{ runner.temp }}/${{ matrix.id }}-ffprobe.json
            ${{ runner.temp }}/${{ matrix.id }}-frames/*.png
          if-no-files-found: warn
          retention-days: 7
