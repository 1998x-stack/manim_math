name: Grade 6 term 1 divisibility consolidated checks

on:
  pull_request:
    paths:
      - '初中/六年级/第一学期/第一章-数的整除/**'
      - '.github/workflows/grade6-term1-divisibility-consolidated.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  divisibility-lessons:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /初中/六年级/第一学期/第一章-数的整除/**/*.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile divisibility lesson sources
        run: python -m compileall -q '初中/六年级/第一学期/第一章-数的整除'
      - name: Run four independent course regressions
        shell: bash
        run: |
          set -euo pipefail
          root='初中/六年级/第一学期/第一章-数的整除'
          for test_file in \
            "$root/001整数和整除的意义/verify_divisibility.py" \
            "$root/002因数与倍数/verify_factors_multiples.py" \
            "$root/003素数与合数/verify_primes_composites.py" \
            "$root/004分解素因数/verify_prime_factorization.py"; do
            test -f "$test_file"
            python "$test_file"
          done
