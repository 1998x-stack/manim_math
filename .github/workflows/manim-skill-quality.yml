name: Manim production skill quality

on:
  push:
    branches:
      - 'skill/manim-runtime-validation-*'
    paths:
      - '.opencode/skills/manim-video-production/**'
      - '.github/workflows/manim-skill-quality.yml'
  pull_request:
    paths:
      - '.opencode/skills/manim-video-production/**'
      - '.github/workflows/manim-skill-quality.yml'

jobs:
  skill-unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geometry verifier dependency
        run: python -m pip install 'numpy>=1.24,<3'
      - name: Compile every skill script
        run: python -m compileall -q .opencode/skills/manim-video-production/scripts
      - name: Run all skill regression tests
        working-directory: .opencode/skills/manim-video-production
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate geometry example CLI
        working-directory: .opencode/skills/manim-video-production
        run: python scripts/verify_geometry.py references/geometry_spec.example.json
